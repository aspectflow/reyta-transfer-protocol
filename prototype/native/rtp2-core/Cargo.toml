[package]
name = "rtp2-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[lib]
name = "rtp2_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
iroh = { version = "=1.0.3" }
blake3 = "=1.8.3"
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
tokio = { version = "1.44.1", features = ["rt-multi-thread", "sync", "time", "io-util", "fs"] }
once_cell = "1.21.3"
parking_lot = "0.12.4"
serde_json = "1.0.140"
zeroize = { version = "1.8.1", features = ["derive"] }

# RTP/2 mandatory suite providers (§6.2, §6.4)
libcrux-ml-kem = { version = "=0.0.10", features = ["mlkem768"] }
libcrux-ml-dsa = { version = "=0.0.10", features = ["mldsa65"] }
x25519-dalek = { version = "2.0.1", features = ["reusable_secrets", "static_secrets", "zeroize"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "zeroize"] }
hkdf = "0.12.4"
hmac = "0.12.1"
sha2 = "0.10.9"
rand_core = { version = "0.6.4", features = ["getrandom"] }
subtle = "2.6.1"
ciborium = "0.2.2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Fast-to-rebuild profile for repeated test runs (mutation checking, CI loops).
# Build time dominates when the suite is rebuilt dozens of times, so this trades
# codegen quality for it: no LTO, opt-level 1, many codegen units. Still fast
# enough at runtime that the crypto tests finish in well under a second.
[profile.quick]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
panic = "unwind"
strip = "none"
